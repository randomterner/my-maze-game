<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maze Game - Public boards</title>
  <script src="/static/socket.io.min.js"></script>
  <link rel="stylesheet" href="/static/game-ui.css?v=20260923">
</head>
<body class="publicBoardsPage">
<main>
  <header class="boardsHeader">
    <h1>Public boards</h1>
    <p>Click a board to enlarge it and see player information. Private notes are never shared.</p>
    <nav><a href="/">Player page</a> · <a href="/manager">Manager page</a> · <a href="#publicLogs">Full game log</a></nav>
    <p id="connectionStatus" role="status">Connecting...</p>
    <p id="gameOverNotice" hidden>Game over — the complete manager map is now revealed.</p>
  </header>
  <div id="boardsDashboard">
    <div id="boardsList"></div>
    <section class="publicLogPanel">
      <h2>Latest message</h2>
      <div id="latestPublicMessage" role="status" aria-live="polite" tabindex="0">No messages yet.</div>
      <h2 id="publicLogHeading">Full game log</h2>
      <div id="publicLogs" tabindex="0" role="region" aria-labelledby="publicLogHeading"></div>
    </section>
  </div>
</main>
<dialog id="boardDetail">
  <header><h2 id="detailTitle"></h2><button id="closeBoardDetail" type="button">Close</button></header>
  <div class="detailColumns"><div id="detailMap"></div><section><h3>Players</h3><div id="detailStats" class="publicStats"></div></section></div>
</dialog>
<script src="/static/game-ui.js?v=20260926"></script>
<script src="/static/translation.js?v=20260926"></script>
<script src="/static/boards.js?v=20260926"></script>
</body>
</html>
